name: Deploy Nakama

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint y type-check ──────────────────────────────────────
  check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: 8 }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - name: Type check API
        run: cd api && pnpm exec tsc --noEmit

      - name: Type check Web
        run: cd web && pnpm exec tsc --noEmit


